AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Serverless E-Commerce Backend System using AWS
  MCA Final Semester Project

# ─── Global settings applied to all Lambda functions ────────────────────────
Globals:
  Function:
    Runtime: nodejs18.x
    Timeout: 30
    MemorySize: 256
    Architectures: [arm64]   # Graviton2 — cheaper & faster
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        DYNAMODB_TABLE: !Ref MainTable
        S3_BUCKET: !Ref ProductImagesBucket
        ORDER_QUEUE_URL: !Ref OrderQueue
        SNS_TOPIC_ARN: !Ref OrderNotificationsTopic
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
    Tracing: Active          # AWS X-Ray tracing
    Layers:
      - !Ref DependenciesLayer
  Api:
    Cors:
      AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
      AllowHeaders: "'Content-Type,Authorization,X-Amz-Date'"
      AllowOrigin: "'*'"

# ─── Parameters (override at deploy time) ────────────────────────────────────
Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
  WebhookSecret:
    Type: String
    NoEcho: true
    Default: 'change-me-in-prod'

# ─── Resources ────────────────────────────────────────────────────────────────
Resources:

  # ── API Gateway ─────────────────────────────────────────────────────────────
  EcommerceApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub 'ecommerce-api-${Stage}'
      StageName: !Ref Stage
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          ThrottlingRateLimit: 1000
          ThrottlingBurstLimit: 500

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/ecommerce-${Stage}'
      RetentionInDays: 14

  # ── Shared Lambda Layer (node_modules) ──────────────────────────────────────
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub 'ecommerce-deps-${Stage}'
      ContentUri: layer/
      CompatibleRuntimes: [nodejs18.x]
      RetentionPolicy: Delete
    Metadata:
      BuildMethod: nodejs18.x

  # ── Auth Lambda ─────────────────────────────────────────────────────────────
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ecommerce-auth-${Stage}'
      CodeUri: code/handlers/
      Handler: auth.handler
      Description: 'User registration, login, token management'
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            Effect: Allow
            Action:
              - cognito-idp:SignUp
              - cognito-idp:InitiateAuth
              - cognito-idp:GlobalSignOut
              - cognito-idp:ConfirmSignUp
            Resource: !GetAtt UserPool.Arn
      Events:
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /auth/register
            Method: POST
            Auth:
              Authorizer: NONE
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE
        Refresh:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /auth/refresh
            Method: POST
            Auth:
              Authorizer: NONE
        Logout:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /auth/logout
            Method: POST
        Confirm:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /auth/confirm
            Method: POST
            Auth:
              Authorizer: NONE

  # ── Product Lambda ───────────────────────────────────────────────────────────
  ProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ecommerce-products-${Stage}'
      CodeUri: code/handlers/
      Handler: products.handler
      Description: 'Product catalog CRUD and image upload'
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - S3CrudPolicy:
            BucketName: !Ref ProductImagesBucket
      Events:
        ListProducts:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /products
            Method: GET
            Auth:
              Authorizer: NONE
        CreateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /products
            Method: POST
        GetProduct:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /products/{id}
            Method: GET
            Auth:
              Authorizer: NONE
        UpdateProduct:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /products/{id}
            Method: PUT
        DeleteProduct:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /products/{id}
            Method: DELETE
        GetUploadUrl:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /products/{id}/upload-url
            Method: POST

  # ── Order Lambda ─────────────────────────────────────────────────────────────
  OrderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ecommerce-orders-${Stage}'
      CodeUri: code/handlers/
      Handler: orders.handler
      Description: 'Cart management and order placement'
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt OrderQueue.QueueName
      Events:
        GetCart:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /cart
            Method: GET
        AddToCart:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /cart
            Method: POST
        RemoveFromCart:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /cart/{productId}
            Method: DELETE
        PlaceOrder:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /orders
            Method: POST
        ListOrders:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /orders
            Method: GET
        GetOrder:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /orders/{id}
            Method: GET

  # ── Payment Lambda ───────────────────────────────────────────────────────────
  PaymentFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'ecommerce-payments-${Stage}'
      CodeUri: code/handlers/
      Handler: payments.handler
      Description: 'Payment webhook handler and SQS processor'
      Environment:
        Variables:
          WEBHOOK_SECRET: !Ref WebhookSecret
      Policies:
        - AWSLambdaBasicExecutionRole
        - DynamoDBCrudPolicy:
            TableName: !Ref MainTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt OrderNotificationsTopic.TopicName
        - SQSPollerPolicy:
            QueueName: !GetAtt OrderQueue.QueueName
      Events:
        WebhookEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref EcommerceApi
            Path: /payments/webhook
            Method: POST
            Auth:
              Authorizer: NONE
        SQSTrigger:
          Type: SQS
          Properties:
            Queue: !GetAtt OrderQueue.Arn
            BatchSize: 5
            FunctionResponseTypes:
              - ReportBatchItemFailures

  # ── DynamoDB Table ───────────────────────────────────────────────────────────
  MainTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'ecommerce-main-${Stage}'
      BillingMode: PAY_PER_REQUEST     # On-demand pricing — no capacity planning
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true               # Encryption at rest
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: entityType
          AttributeType: S
        - AttributeName: category
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: entity-type-index
          KeySchema:
            - AttributeName: entityType
              KeyType: HASH
            - AttributeName: SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: category-index
          KeySchema:
            - AttributeName: category
              KeyType: HASH
            - AttributeName: PK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: user-orders-index
          KeySchema:
            - AttributeName: SK
              KeyType: HASH
            - AttributeName: PK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── S3 Bucket ────────────────────────────────────────────────────────────────
  ProductImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'ecommerce-images-${Stage}-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        IgnorePublicAcls: false
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldTempUploads
            Status: Enabled
            Prefix: temp/
            ExpirationInDays: 1

  # ── SQS Queue ────────────────────────────────────────────────────────────────
  OrderQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'order-processing-${Stage}.fifo'
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 180           # 6x Lambda timeout
      MessageRetentionPeriod: 86400   # 1 day
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt OrderDLQ.Arn
        maxReceiveCount: 3

  OrderDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub 'order-dlq-${Stage}.fifo'
      FifoQueue: true
      ContentBasedDeduplication: false
      MessageRetentionPeriod: 604800  # 7 days

  # ── SNS Topic ────────────────────────────────────────────────────────────────
  OrderNotificationsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub 'order-notifications-${Stage}'
      DisplayName: 'E-Commerce Order Notifications'

  OrderEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref OrderNotificationsTopic
      Protocol: email
      Endpoint: pradeep1karvy@gmail.com  # Change this

  # ── Cognito ──────────────────────────────────────────────────────────────────
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'ecommerce-users-${Stage}'
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          Required: true
          Mutable: true
        - Name: name
          Required: true
          Mutable: true
      UserPoolTags:
        Project: ecommerce-mca
        Stage: !Ref Stage

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'ecommerce-client-${Stage}'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1       # hours
      IdTokenValidity: 1
      RefreshTokenValidity: 30     # days

  # ── CloudWatch Dashboard ──────────────────────────────────────────────────────
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub 'ecommerce-dashboard-${Stage}'
      DashboardBody: !Sub |
        {
          "widgets": [
            { "type": "metric", "width": 12, "height": 6, "properties": {
              "title": "Lambda Invocations",
              "metrics": [
                ["AWS/Lambda", "Invocations", "FunctionName", "ecommerce-auth-${Stage}"],
                ["AWS/Lambda", "Invocations", "FunctionName", "ecommerce-products-${Stage}"],
                ["AWS/Lambda", "Invocations", "FunctionName", "ecommerce-orders-${Stage}"],
                ["AWS/Lambda", "Invocations", "FunctionName", "ecommerce-payments-${Stage}"]
              ],
              "region": "ap-south-1", "period": 300, "stat": "Sum", "view": "timeSeries"
            }},
            { "type": "metric", "width": 12, "height": 6, "properties": {
              "title": "Lambda Errors",
              "metrics": [
                ["AWS/Lambda", "Errors", "FunctionName", "ecommerce-auth-${Stage}"],
                ["AWS/Lambda", "Errors", "FunctionName", "ecommerce-products-${Stage}"],
                ["AWS/Lambda", "Errors", "FunctionName", "ecommerce-orders-${Stage}"],
                ["AWS/Lambda", "Errors", "FunctionName", "ecommerce-payments-${Stage}"]
              ],
              "region": "ap-south-1", "period": 300, "stat": "Sum", "view": "timeSeries"
            }}
          ]
        }

  # ── CloudWatch Alarms ────────────────────────────────────────────────────────
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub 'ecommerce-high-error-rate-${Stage}'
      AlarmDescription: 'Lambda error rate too high'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref OrderFunction
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      Statistic: Sum
      AlarmActions:
        - !Ref OrderNotificationsTopic

# ─── Outputs ──────────────────────────────────────────────────────────────────
Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub 'https://${EcommerceApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref UserPoolClient
  DynamoDBTableName:
    Description: DynamoDB table name
    Value: !Ref MainTable
  S3BucketName:
    Description: S3 bucket for product images
    Value: !Ref ProductImagesBucket
  OrderQueueUrl:
    Description: SQS Order Queue URL
    Value: !Ref OrderQueue
